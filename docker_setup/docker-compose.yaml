version: '3.8'

services:
  nats:
    image: nats:latest
    container_name: nats-server
    ports:
      - "4222:4222"   # Client port
      - "8222:8222"   # Monitoring port
      - "6222:6222"   # Cluster port
      - "8080:8080"   # WebSocket port
    volumes:
      - ./nats.conf:/etc/nats/nats.conf
      - ./nats-data:/data/nats
    command: "-c /etc/nats/nats.conf -js -DV"

